[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = []

# ── CORS headers ──────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, PATCH, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization, X-Session-Token"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, PATCH, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization, X-Session-Token"

# ── Block PHP / sensitive files (served as text on Netlify) ──
# force=true is required: Netlify would otherwise serve the real
# file instead of honoring the redirect.
[[redirects]]
  from = "/config.php"
  to = "/.netlify/functions/"
  status = 404
  force = true

[[redirects]]
  from = "/admin_api.php"
  to = "/.netlify/functions/"
  status = 404
  force = true

