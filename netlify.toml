[[redirects]]
  from = "/netlify/*"
  to = "/.netlify/functions/"
  status = 404
  force = true

# ── Block uploads directory (user documents) ──────────────────
[[redirects]]
  from = "/uploads/*"
  to = "/.netlify/functions/"
  status = 404
  force = true

[[redirects]]
  from = "/uploads"
