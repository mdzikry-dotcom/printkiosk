<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PrintKiosk">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/assets/icon-512.png">
<title>PrintKiosk — Intro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-top:#eaf1ff;
    --bg-bottom:#f8faff;
    --printer-body:#2e3444;
    --printer-body-light:#3d445a;
    --printer-slot:#181c26;
    --paper:#ffffff;
    --paper-line:#cfd8e6;
    --accent:#3b6ef6;
    --accent-2:#22c7b8;
    --ink:#1b2033;
    --muted:#7580a0;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    height:100%;
    overflow:hidden;
    font-family:'DM Sans', -apple-system, system-ui, sans-serif;
    background:linear-gradient(180deg,var(--bg-top),var(--bg-bottom));
  }

  /* ================= SPLASH STAGE ================= */
  .stage{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:opacity 0.45s ease;
  }
  .stage.fade-out{ opacity:0; pointer-events:none; }

  .rig{
    position:relative;
    width:280px;
    height:280px;
  }

  /* ---- printer ---- */
  .printer{
    position:absolute;
    left:50%;
    bottom:78px;
    width:168px;
    height:82px;
    transform:translateX(-50%);
    transform-origin:bottom center;
    animation:printerSquash 0.7s ease-out 0.05s 1;
  }
  .printer-body{
    position:absolute;
    inset:0;
    background:var(--printer-body);
    border-radius:14px 14px 8px 8px;
  }
  .printer-body::before{
    content:'';
    position:absolute;
    left:10px; right:10px; top:8px;
    height:8px;
    border-radius:5px;
    background:var(--printer-body-light);
  }
  .printer-slot{
    position:absolute;
    top:-6px; left:24px; right:24px;
    height:12px;
    background:var(--printer-slot);
    border-radius:4px;
  }
  .printer-light{
    position:absolute;
    right:16px; bottom:16px;
    width:8px; height:8px;
    border-radius:50%;
    background:var(--accent-2);
    box-shadow:0 0 8px 2px rgba(34,199,184,0.7);
    animation:blink 1.1s ease-in-out infinite;
  }
  .printer-base{
    position:absolute;
    left:-8px; right:-8px; bottom:-10px;
    height:14px;
    background:#242938;
    border-radius:8px;
  }

  /* ---- paper ---- */
  .paper{
    position:absolute;
    left:50%;
    bottom:154px;
    width:96px;
    height:126px;
    margin-left:-48px;
    background:var(--paper);
    border-radius:3px;
    box-shadow:0 8px 20px rgba(20,30,60,0.18);
    opacity:0;
    padding:16px 14px;
    animation:
      paperEject 0.75s cubic-bezier(.34,1.35,.64,1) 0.15s forwards,
      paperFly   1.05s cubic-bezier(.55,0,.85,.4) 0.9s forwards;
  }
  .paper-line{
    height:6px;
    border-radius:3px;
    background:var(--paper-line);
    margin-bottom:10px;
  }
  .paper-line.w1{ width:100%; }
  .paper-line.w2{ width:82%; }
  .paper-line.w3{ width:60%; background:var(--accent); opacity:0.55; }

  .puff{
    position:absolute;
    left:50%;
    bottom:150px;
    width:10px; height:10px;
    margin-left:-5px;
    border-radius:50%;
    background:rgba(120,140,180,0.35);
    opacity:0;
    animation:puff 0.6s ease-out 0.55s forwards;
  }

  /* ---- logo lockup ---- */
  .logo{
    position:absolute;
    left:50%; top:62%;
    transform:translate(-50%,12px) scale(0.85);
    text-align:center;
    opacity:0;
    animation:logoIn 0.6s cubic-bezier(.2,1.4,.4,1) 1.95s forwards;
  }
  .logo h1{
    margin:0;
    font-size:30px;
    font-weight:900;
    letter-spacing:-0.01em;
    color:var(--ink);
  }
  .logo h1 span{ color:var(--accent); }
  .logo p{
    margin:6px 0 0;
    font-size:13px;
    font-weight:500;
    letter-spacing:0.04em;
    color:var(--muted);
  }

  .confetti-dot{
    position:absolute;
    left:50%; top:62%;
    width:6px; height:6px;
    border-radius:50%;
    opacity:0;
  }

  /* ================= keyframes ================= */
  @keyframes printerSquash{
    0%{ transform:translateX(-50%) scaleY(1); }
    12%{ transform:translateX(-50%) scaleY(0.9); }
    30%{ transform:translateX(-50%) scaleY(1.04); }
    50%{ transform:translateX(-50%) scaleY(1); }
  }

  @keyframes blink{
    0%,100%{ opacity:1; }
    50%{ opacity:0.35; }
  }

  @keyframes paperEject{
    0%{ opacity:0; bottom:118px; transform:rotate(0deg); }
    18%{ opacity:1; }
    100%{ opacity:1; bottom:182px; transform:rotate(-3deg); }
  }

  @keyframes paperFly{
    0%{ bottom:182px; left:50%; margin-left:-48px; transform:rotate(-3deg) scale(1); opacity:1; }
    100%{ bottom:560px; left:78%; margin-left:-48px; transform:rotate(28deg) scale(0.35); opacity:0; }
  }

  @keyframes puff{
    0%{ opacity:0.5; transform:scale(1) translateY(0); }
    100%{ opacity:0; transform:scale(3.2) translateY(-18px); }
  }

  @keyframes logoIn{
    0%{ opacity:0; transform:translate(-50%,12px) scale(0.85); }
    60%{ opacity:1; transform:translate(-50%,-2px) scale(1.03); }
    100%{ opacity:1; transform:translate(-50%,0) scale(1); }
  }

  @keyframes confettiBurst{
    0%{ opacity:1; transform:translate(0,0) scale(1); }
    100%{ opacity:0; transform:translate(var(--dx),var(--dy)) scale(0.4); }
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="rig">
    <div class="paper" id="paper">
      <div class="paper-line w1"></div>
      <div class="paper-line w2"></div>
      <div class="paper-line w3"></div>
    </div>
    <div class="puff"></div>

    <div class="printer">
      <div class="printer-slot"></div>
      <div class="printer-body">
        <div class="printer-light"></div>
      </div>
      <div class="printer-base"></div>
    </div>

    <div class="logo" id="logo">
      <h1>Print<span>Kiosk</span></h1>
      <p>PRINT&nbsp;&middot;&nbsp;PAY&nbsp;&middot;&nbsp;PICKUP</p>
    </div>

    <div id="confettiHost"></div>
  </div>
</div>

<script>
  // confetti burst timed with logo reveal
  const host = document.getElementById('confettiHost');
  const colors = ['#3b6ef6', '#22c7b8', '#ffb648', '#ff6f91'];
  for(let i=0;i<12;i++){
    const dot = document.createElement('div');
    dot.className = 'confetti-dot';
    const angle = (Math.PI * 2 * i) / 12 + Math.random()*0.3;
    const dist = 60 + Math.random()*40;
    dot.style.setProperty('--dx', (Math.cos(angle)*dist) + 'px');
    dot.style.setProperty('--dy', (Math.sin(angle)*dist - 20) + 'px');
    dot.style.background = colors[i % colors.length];
    dot.style.animation = `confettiBurst 0.8s ease-out ${2.0 + Math.random()*0.1}s forwards`;
    host.appendChild(dot);
  }

  // play intro, then go to login
  const stage = document.getElementById('stage');

  setTimeout(()=>{
    stage.classList.add('fade-out');
    setTimeout(()=>{
      window.location.href = 'login.html';
    }, 480);
  }, 2600);
</script>

</body>
</html>
