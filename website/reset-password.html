<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PrintKiosk">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/assets/icon-512.png">
<title>PrintKiosk - Create New Password</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<script src="../frontend_config.js"></script>
</head>
<body>
<div class="auth-page">
  <div class="auth-card animate-slide-up">
    <div class="auth-header">
      <div class="auth-logo">
        <svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs><linearGradient id="pbg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#4C7CFF"/><stop offset="100%" stop-color="#1C2740"/></linearGradient><linearGradient id="pfold" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#E4EBFA"/><stop offset="100%" stop-color="#C7D4EE"/></linearGradient></defs>
          <rect width="512" height="512" rx="112" fill="url(#pbg)"/>
          <g transform="rotate(-7 256 256)"><rect x="149" y="352" width="214" height="32" rx="16" fill="#22C7B8"/><path d="M179 136L305 136L351 182L351 358Q351 376 333 376L179 376Q161 376 161 358L161 154Q161 136 179 136Z" fill="#FFF"/><path d="M305 136L351 182L305 182Z" fill="url(#pfold)"/></g>
        </svg>
      </div>
      <h1 class="auth-title">Create New Password</h1>
      <p class="auth-subtitle">Set a new password for your PrintKiosk account</p>
    </div>

    <div id="invalidView" style="display:none; text-align:center; padding:20px 0;">
      <p class="error-text" style="display:block; color:#dc2626;">This reset link is invalid or has expired.</p>
      <p style="font-size:14px; color:var(--gray-500); margin:12px 0 20px;">Please request a new reset link.</p>
      <a href="login.html" class="btn btn-primary btn-block">Back to Login</a>
    </div>

    <form id="resetForm" style="display:none;">
      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" class="input" placeholder="At least 6 characters" minlength="6" required autocomplete="new-password">
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirm New Password</label>
        <input type="password" id="confirmPassword" class="input" placeholder="Repeat new password" required autocomplete="new-password">
      </div>
      <p id="resetMsg" class="error-text" style="display:none; text-align:center; margin-bottom:12px;"></p>
      <button type="submit" class="btn btn-primary btn-block btn-lg" id="resetBtn">Reset Password</button>
    </form>
  </div>
</div>

<script>
function showMsg(el, msg, isSuccess) {
  el.className = isSuccess ? 'success-text' : 'error-text';
  el.style.color = isSuccess ? '#16a34a' : '#dc2626';
  el.textContent = msg;
  el.style.display = 'block';
}

function setLoading(btn, loading, text) {
  btn.disabled = loading;
  if (loading) {
    btn.innerHTML = '<span class="btn-spinner"></span>' + text;
  } else {
    btn.innerHTML = text;
  }
}

const token = new URLSearchParams(window.location.search).get('token') || '';

if (!token) {
  document.getElementById('invalidView').style.display = 'block';
} else {
  document.getElementById('resetForm').style.display = 'block';
  document.getElementById('newPassword').focus();
}

document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msgEl = document.getElementById('resetMsg');
  msgEl.style.display = 'none';

  const newPassword = document.getElementById('newPassword').value;
  const confirmPassword = document.getElementById('confirmPassword').value;
  const btn = document.getElementById('resetBtn');

  if (newPassword.length < 6) {
    showMsg(msgEl, 'Password must be at least 6 characters', false);
    return;
  }
  if (newPassword !== confirmPassword) {
    showMsg(msgEl, 'Passwords do not match', false);
    return;
  }

  setLoading(btn, true, 'Resetting...');

  try {
    const res = await fetch(API('auth', 'reset-password'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, newPassword })
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.error || 'Reset failed');

    showMsg(msgEl, 'Password reset successful. Redirecting to login...', true);
    document.getElementById('resetForm').style.display = 'none';
    setTimeout(() => { window.location.href = 'login.html'; }, 2000);
  } catch (err) {
    showMsg(msgEl, err.message || 'Connection error. Please try again.', false);
    btn.disabled = false;
    btn.textContent = 'Reset Password';
  }
});
</script>
</body>
</html>
